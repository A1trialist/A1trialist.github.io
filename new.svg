<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="petalGradient" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" style="stop-color:#C8D6FA;stop-opacity:1" />
      <stop offset="60%" style="stop-color:#8A9CE6;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#6B7FD7;stop-opacity:0.8" />
    </radialGradient>
    
    <radialGradient id="centerGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#FFFFE0;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#FFFFE0;stop-opacity:0" />
    </radialGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <g filter="url(#softGlow)">
    <circle cx="32" cy="20" r="14" fill="url(#petalGradient)" />
    <circle cx="44" cy="28" r="14" fill="url(#petalGradient)" />
    <circle cx="40" cy="42" r="14" fill="url(#petalGradient)" />
    <circle cx="24" cy="42" r="14" fill="url(#petalGradient)" />
    <circle cx="20" cy="28" r="14" fill="url(#petalGradient)" />
    
    <circle cx="32" cy="32" r="12" fill="url(#petalGradient)" opacity="0.8" />
    
    <circle cx="32" cy="32" r="6" fill="url(#centerGradient)" />
  </g>
</svg>
